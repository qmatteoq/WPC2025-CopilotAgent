name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Create development settings file
      run: echo '{}' > travel-agent/TravelAgent/appsettings.Development.json
      
    - name: Restore dependencies
      run: dotnet restore travel-agent/TravelAgent.AppHost/TravelAgent.AppHost.csproj
      
    - name: Build solution
      run: dotnet build travel-agent/TravelAgent.AppHost/TravelAgent.AppHost.csproj --no-restore
